    <style id="visual-refresh">
      :root {
        --background-bg-base: 216 40% 98%;
        --background-bg-subtle: 216 32% 95%;
        --background-bg-component: 0 0% 100%;
        --background-bg-component-hover: 216 34% 97%;
        --background-bg-input: 0 0% 100%;
        --background-bg-input-hover: 216 34% 97%;
        --foreground-fg-base: 222 38% 15%;
        --foreground-fg-subtle: 218 18% 38%;
        --foreground-fg-muted: 216 14% 47%;
        --border-base: 215 26% 90%;
        --border-strong: 215 20% 82%;
        --button-inverted: 222 56% 24%;
        --button-inverted-hover: 222 53% 31%;
        --controls-tag-bg-neutral: 216 28% 93%;
        --text-primary: 222 38% 15%;
        --text-secondary: 218 18% 38%;
        --text-muted: 216 14% 47%;
        --border-primary: 215 24% 87%;
        --border-input: 215 24% 83%;
        --border-input-ring: 221 46% 42%;
        --background-primary: 216 40% 98%;
        --background-secondary: 216 32% 95%;
        --background-secondary-hover: 216 27% 91%;
        --background-accent: 216 26% 92%;
        --background-accent-hover: 215 24% 88%;
        --chart-1: 352 68% 48%;
        --chart-2: 201 72% 40%;
        --chart-3: 39 88% 54%;
        --chart-4: 260 55% 58%;
        --chart-5: 160 52% 38%;
      }

      html { background: #eef3f8; }
      body {
        margin: 0;
        background: #eef3f8;
      }

      .min-h-screen.bg-background {
        background:
          radial-gradient(circle at 10% 7%, rgba(170, 35, 55, .09), transparent 31rem),
          radial-gradient(circle at 91% 15%, rgba(35, 80, 145, .11), transparent 34rem),
          linear-gradient(180deg, #f8fafc 0%, #eef3f8 100%) !important;
      }

      .mx-auto.w-full.max-w-5xl {
        max-width: 70rem;
      }

      header.mb-4 {
        position: relative;
        overflow: hidden;
        padding: 2rem 2.15rem 1.9rem 6.3rem;
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 1.35rem;
        background:
          linear-gradient(112deg, rgba(17,31,57,.98) 0%, rgba(34,57,99,.98) 57%, rgba(124,36,49,.97) 100%);
        color: white;
        box-shadow: 0 18px 50px rgba(20, 39, 69, .18), 0 3px 10px rgba(20, 39, 69, .08);
      }

      header.mb-4::before {
        content: "";
        position: absolute;
        left: 2rem;
        top: 2rem;
        z-index: 2;
        width: 3rem;
        height: 3rem;
        border: 1px solid rgba(255,255,255,.48);
        border-radius: .95rem;
        background:
          radial-gradient(circle at 31% 34%, #fff7df 0 .36rem, transparent .38rem),
          radial-gradient(circle at 69% 33%, #f2cd78 0 .36rem, transparent .38rem),
          radial-gradient(circle at 50% 70%, #e05c68 0 .42rem, transparent .44rem),
          conic-gradient(from 30deg at 50% 51%, #f5d47e 0 16%, transparent 16% 34%, #f5d47e 34% 50%, transparent 50% 67%, #f5d47e 67% 83%, transparent 83% 100%),
          linear-gradient(145deg, #263c62 0%, #172641 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 8px 22px rgba(0,0,0,.18);
      }

      header.mb-4::after {
        content: "";
        position: absolute;
        right: -7rem;
        top: -8.5rem;
        width: 20rem;
        height: 20rem;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 50%;
        box-shadow:
          0 0 0 3rem rgba(255,255,255,.035),
          0 0 0 6rem rgba(255,255,255,.025),
          0 0 0 9rem rgba(255,255,255,.016);
        pointer-events: none;
      }

      header.mb-4 h1 {
        position: relative;
        z-index: 1;
        max-width: 48rem;
        color: #fff;
        font-size: clamp(2rem, 4vw, 2.75rem);
        font-weight: 750;
        letter-spacing: -.035em;
        line-height: 1.02;
        text-wrap: balance;
      }

      header.mb-4 h1::before {
        content: none;
        display: none;
      }

      header.mb-4 h1::after {
        content: "";
        display: block;
        width: 5.8rem;
        height: .25rem;
        margin-top: .9rem;
        border-radius: 999px;
        background: linear-gradient(90deg, #f1c965 0 52%, #e05c68 52% 100%);
      }

      header.mb-4 p {
        position: relative;
        z-index: 1;
        max-width: 49rem;
        margin-top: .95rem !important;
        color: rgba(255,255,255,.76) !important;
        line-height: 1.62;
      }

      header.mb-4 p .text-foreground {
        color: #fff !important;
        font-weight: 650;
      }

      div[role="tablist"] {
        gap: .3rem;
        margin-bottom: .7rem;
        padding: .3rem;
        border: 1px solid rgba(188, 200, 216, .75) !important;
        border-radius: .85rem;
        background: rgba(255,255,255,.78);
        box-shadow: 0 7px 24px rgba(31,49,85,.07);
        backdrop-filter: blur(12px);
      }

      div[role="tablist"] button {
        margin-bottom: 0 !important;
        border: 0 !important;
        border-radius: .62rem;
        padding: .52rem .85rem;
        transition: background-color .16s ease, color .16s ease, box-shadow .16s ease, transform .16s ease;
      }

      div[role="tablist"] button[aria-selected="true"] {
        background: #20365f;
        color: #fff !important;
        box-shadow: 0 5px 14px rgba(32,54,95,.2);
      }

      div[role="tablist"] button:not([aria-selected="true"]):hover {
        background: #edf2f7;
      }

      div.sticky.top-0 {
        margin-top: .2rem;
        border: 1px solid rgba(188, 200, 216, .72) !important;
        border-radius: .85rem;
        background: rgba(249,251,253,.93) !important;
        box-shadow: 0 10px 28px rgba(31,49,85,.08);
        backdrop-filter: blur(14px);
      }

      div.sticky.top-0 > div:first-child > span:first-child {
        box-shadow: 0 4px 12px rgba(32,54,95,.2);
      }

      .rounded-md.border.bg-component {
        border-color: rgba(194, 204, 218, .82) !important;
        background: rgba(255,255,255,.92) !important;
        box-shadow: 0 5px 18px rgba(31,49,85,.055);
      }

      .rounded-md.border.bg-component:hover {
        border-color: rgba(152, 169, 191, .88) !important;
      }

      h2.text-sm.font-semibold {
        display: flex;
        align-items: center;
        gap: .55rem;
        color: #1c2d4b;
        letter-spacing: -.01em;
      }

      h2.text-sm.font-semibold::before {
        content: "";
        width: .28rem;
        height: 1rem;
        flex: 0 0 auto;
        border-radius: 999px;
        background: linear-gradient(180deg, #264b80 0%, #b83d4f 100%);
      }

      input[type="range"] {
        accent-color: #284a7c !important;
      }

      input[type="text"], select {
        box-shadow: inset 0 1px 2px rgba(31,49,85,.04);
      }

      button {
        transition: background-color .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;
      }

      @media (max-width: 640px) {
        .mx-auto.w-full.max-w-5xl { padding-top: .75rem; }

        header.mb-4 {
          padding: 5.25rem 1.25rem 1.35rem;
          border-radius: 1.1rem;
        }

        header.mb-4::before {
          left: 1.25rem;
          top: 1.25rem;
          width: 2.75rem;
          height: 2.75rem;
          border-radius: .82rem;
        }

        header.mb-4::after {
          right: -10rem;
          top: -9rem;
        }

        header.mb-4 h1 {
          font-size: 2rem;
        }

        header.mb-4 h1::before {
          font-size: .6rem;
          letter-spacing: .15em;
        }

        div[role="tablist"] button {
          flex: 1 1 0;
          padding-left: .55rem;
          padding-right: .55rem;
        }

        div.sticky.top-0 {
          border-left: 0 !important;
          border-right: 0 !important;
          border-radius: 0 0 .85rem .85rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
